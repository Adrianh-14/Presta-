server {
    listen 3005;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Las solicitudes pueden incluir evidencia multimedia (fotos/video).
    # Se mantiene un límite superior definido, nunca carga ilimitada.
    client_max_body_size 70m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(self)" always;

    error_page 404 /404/index.html;

    location = /404/index.html {
        internal;
    }

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "healthy\n";
    }

    location /api/ {
        proxy_pass http://api:5001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    # La aplicación React conserva sus rutas privadas y se sirve con su
    # propio shell, mientras la raíz queda reservada para las páginas SEO.
    location ~ ^/(admin|plataforma|cobrador|portal)(/|$) {
        try_files $uri /app/index.html;
    }

    location = /login { try_files $uri /app/index.html; }
    location = /registro { try_files $uri /app/index.html; }
    location = /recuperar-contrasena { try_files $uri /app/index.html; }
    location = /solicitud { try_files $uri /app/index.html; }

    # La raíz pública siempre debe mostrar la landing SEO, nunca el shell
    # autenticado de React. Las rutas privadas se declaran arriba.
    location = / {
        try_files /index.html =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
