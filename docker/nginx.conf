server {
    listen 3005;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Las solicitudes pueden incluir evidencia multimedia (fotos/video).
    # Se mantiene un límite superior definido, nunca carga ilimitada.
    client_max_body_size 70m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(self)" always;

    error_page 404 /404/index.html;

    location = /404/index.html {
        internal;
    }

    # Compatibilidad con la ruta histórica de la aplicación. Debe servirse
    # localmente sin pasar por la canonicalización de /index.html.
    location = /app/ {
        rewrite ^ /app/index.html break;
    }

    # Evita que /index.html y /ruta/index.html se indexen como páginas
    # distintas de / y /ruta/.
    location = /index.html {
        return 301 /;
    }

    location ~ ^(?<clean_path>/.+)/index\.html$ {
        return 301 $clean_path/;
    }

    # URL antigua descubierta por Google: conserva autoridad y evita un 404.
    location = /invertir-20000-euros-vivienda/ {
        return 301 /gestion-cartera-prestamos/;
    }

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "healthy\n";
    }

    location /api/ {
        proxy_pass http://api:5001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    # La aplicación React conserva sus rutas privadas y se sirve con su
    # propio shell, mientras la raíz queda reservada para las páginas SEO.
    location ~ ^/(admin|plataforma|cobrador|portal)(/|$) {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        rewrite ^ /app/index.html break;
    }

    # Rutas SPA: se sirve el shell sin cambiar la URL solicitada. Esto es
    # importante para que los enlaces públicos /solicitud?tenant=... no
    # pierdan el tenant ni terminen en el login.
    location = /login { add_header Cache-Control "no-store, no-cache, must-revalidate" always; rewrite ^ /app/index.html break; }
    location = /registro { add_header Cache-Control "no-store, no-cache, must-revalidate" always; rewrite ^ /app/index.html break; }
    location = /recuperar-contrasena { add_header Cache-Control "no-store, no-cache, must-revalidate" always; rewrite ^ /app/index.html break; }
    location = /solicitud { add_header Cache-Control "no-store, no-cache, must-revalidate" always; rewrite ^ /app/index.html break; }
    location = /solicitud/decision { add_header Cache-Control "no-store, no-cache, must-revalidate" always; rewrite ^ /app/index.html break; }

    # La raíz pública siempre debe mostrar la landing SEO, nunca el shell
    # autenticado de React. Las rutas privadas se declaran arriba.
    location = / {
        try_files /index.html =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
