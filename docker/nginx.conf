map $http_cf_connecting_ip $client_ip {
    ""      $remote_addr;
    default $http_cf_connecting_ip;
}

server {
    listen 3005;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    # El puerto 3005 solo existe dentro del contenedor. Las redirecciones
    # públicas deben conservar el dominio HTTPS del proxy/túnel.
    absolute_redirect off;

    # Las solicitudes pueden incluir evidencia multimedia (fotos/video).
    # Se mantiene un límite superior definido, nunca carga ilimitada.
    client_max_body_size 70m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(self)" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; frame-ancestors 'none'; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https://*.tile.openstreetmap.org; media-src 'self' blob:; connect-src 'self' https://nominatim.openstreetmap.org; form-action 'self'" always;

    error_page 404 /404/index.html;

    location = /404/index.html {
        internal;
    }

    # Compatibilidad con la ruta histórica de la aplicación. Debe servirse
    # localmente sin pasar por la canonicalización de /index.html.
    location = /app/ {
        rewrite ^ /app/index.html break;
    }

    # Evita que /index.html y /ruta/index.html se indexen como páginas
    # distintas de / y /ruta/.
    location = /index.html {
        return 301 /;
    }

    location ~ ^(?<clean_path>/.+)/index\.html$ {
        # Solo canonicaliza una URL que el navegador pidió explícitamente.
        # Las páginas SEO usan internamente /ruta/index.html para servir el
        # archivo estático y no deben redirigirse a sí mismas.
        if ($request_uri ~* index\.html) {
            return 301 $clean_path/;
        }
    }

    # URL antigua descubierta por Google: conserva autoridad y evita un 404.
    location = /invertir-20000-euros-vivienda/ {
        return 301 /gestion-cartera-prestamos/;
    }

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        include /etc/nginx/security-headers.conf;
        return 200 "healthy\n";
    }

    location /api/ {
        include /etc/nginx/security-headers.conf;
        proxy_pass http://api:5001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Sobrescribe el valor entrante del cliente para impedir spoofing de IP
        # en límites por dirección y auditoría de solicitudes.
        # Cloudflare overwrites CF-Connecting-IP at its edge; ignore arbitrary
        # X-Forwarded-For supplied by clients to prevent spoofing rate-limit keys.
        proxy_set_header X-Forwarded-For $client_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    # La aplicación React conserva sus rutas privadas y se sirve con su
    # propio shell, mientras la raíz queda reservada para las páginas SEO.
    location ~ ^/(admin|plataforma|cobrador|portal)(/|$) {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        include /etc/nginx/security-headers.conf;
        rewrite ^ /app/index.html break;
    }

    # Rutas SPA: se sirve el shell sin cambiar la URL solicitada. Esto es
    # importante para que los enlaces públicos /solicitud?tenant=... no
    # pierdan el tenant ni terminen en el login.
    location = /login { add_header Cache-Control "no-store, no-cache, must-revalidate" always; include /etc/nginx/security-headers.conf; rewrite ^ /app/index.html break; }
    location = /registro { add_header Cache-Control "no-store, no-cache, must-revalidate" always; include /etc/nginx/security-headers.conf; rewrite ^ /app/index.html break; }
    location = /recuperar-contrasena { add_header Cache-Control "no-store, no-cache, must-revalidate" always; include /etc/nginx/security-headers.conf; rewrite ^ /app/index.html break; }
    location = /solicitud { add_header Cache-Control "no-store, no-cache, must-revalidate" always; include /etc/nginx/security-headers.conf; rewrite ^ /app/index.html break; }
    location = /solicitud/decision { add_header Cache-Control "no-store, no-cache, must-revalidate" always; include /etc/nginx/security-headers.conf; rewrite ^ /app/index.html break; }

    # La portada pública usa ahora la landing Bonexa del shell React. Las
    # páginas SEO internas conservan sus archivos estáticos y las rutas
    # privadas se declaran arriba.
    location = / {
        include /etc/nginx/security-headers.conf;
        rewrite ^ /app/index.html break;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
