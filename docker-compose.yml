services:
  postgres:
    image: postgres:16-alpine
    container_name: prestamoplus_db
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-prestamoplus}
      POSTGRES_USER: ${POSTGRES_USER:-prestamoplus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD in the ignored .env file}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: prestamoplus_api
    restart: unless-stopped
    ports:
      - "5002:5001"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ASPNETCORE_URLS: http://+:5001
      DatabaseProvider: PostgreSQL
      # Dokploy puede entregar una cadena completa para una base administrada.
      # Si no existe, se usa el PostgreSQL del mismo Compose.
      ConnectionStrings__DefaultConnection: "${ConnectionStrings__DefaultConnection:-${DATABASE_CONNECTION_STRING:-Host=${POSTGRES_HOST:-postgres};Port=${POSTGRES_PORT:-5432};Database=${POSTGRES_DB:-prestamoplus};Username=${POSTGRES_USER:-prestamoplus};Password=${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD in the ignored .env file}}}"
      ClientAuthentication__Enabled: "true"
      DemoData__Enabled: "false"
      JwtSettings__SecretKey: ${JWT_SECRET:-dev-only-change-this-secret-key-please-rotate-in-production-2026}
      JwtSettings__Issuer: ${JWT_ISSUER:-PrestamoPlus}
      JwtSettings__Audience: ${JWT_AUDIENCE:-PrestamoPlusApp}
      ClientAuthentication__OtpPepper: ${CLIENT_AUTH_OTP_PEPPER:-local-development-otp-pepper-change-before-production-2026}
      ClientAuthentication__OtpLifetimeMinutes: ${CLIENT_AUTH_OTP_LIFETIME_MINUTES:-10}
      ClientAuthentication__MaximumVerificationAttempts: ${CLIENT_AUTH_MAX_VERIFICATION_ATTEMPTS:-5}
      ClientAuthentication__RequestLimitPerWindow: ${CLIENT_AUTH_REQUEST_LIMIT_PER_WINDOW:-10}
      ClientAuthentication__SessionLifetimeMinutes: ${CLIENT_AUTH_SESSION_LIFETIME_MINUTES:-480}
      Resend__ApiKey: ${RESEND_API_KEY:-}
      Resend__FromEmail: ${RESEND_FROM_EMAIL:-onboarding@resend.dev}
      Resend__FromName: ${RESEND_FROM_NAME:-PrestamoPlus}
      Resend__ClientPortalUrl: ${RESEND_CLIENT_PORTAL_URL:-http://localhost:3005/portal/login}
      Security__RealDataApproved: ${SECURITY_REAL_DATA_APPROVED:-false}
      Security__ReleaseApprovalReference: ${SECURITY_RELEASE_APPROVAL_REFERENCE:-}
    volumes:
      - uploads:/uploads
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - default
      - dokploy-network
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:5001/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: prestamoplus_web
    restart: unless-stopped
    ports:
      - "3005:3005"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:3005/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Cloudflare Tunnel publica el frontend sin exponer puertos entrantes.
  # En Dokploy basta declarar CLOUDFLARED_TUNNEL_TOKEN. Sin token, el
  # contenedor termina de forma controlada y el entorno local sigue funcionando.
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARED_TUNNEL_TOKEN:-}
    entrypoint: ["/bin/sh", "-c"]
    command: >-
      if [ -z "$$TUNNEL_TOKEN" ]; then echo "CLOUDFLARED_TUNNEL_TOKEN no configurado"; exit 0; fi;
      cloudflared tunnel --no-autoupdate run --token "$$TUNNEL_TOKEN"
    depends_on:
      frontend:
        condition: service_healthy

volumes:
  pgdata:
  uploads:

networks:
  dokploy-network:
    external: true
