services:
  postgres:
    image: postgres:16-alpine
    container_name: prestamoplus_db
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: prestamoplus
      POSTGRES_USER: prestamoplus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD in the ignored .env file}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prestamoplus"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
